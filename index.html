<!-- The project combines Objects, Array Methods (.filrer()), 
 DOM manipulation, Events and LocalStorage to persist data when the brower refreshes -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-App</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="todo-app">
        <h1>📝To-Do App</h1>
        <p>Stay productive</p>
        
        <label for="tasks-input">Task</label>
        <input type="text" name="task" id="tasks-input" placeholder="Enter Task to Add...">
        <button id="add-btn">Add Task</button>

        <ul id="tasks-list"></ul>
        <button id="clear-comp-btn">Clear Completed Task</button>
        <button id="clear-all-btn">Clear All Task</button>
    </div>
    
</body>
</html>
